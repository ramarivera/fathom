[package]
name = "fathom-mcp"
version = "0.1.2"
edition = "2021"
rust-version = "1.75"
description = "CLI + MCP server wrapping the OpenAI Deep Research API"
license = "MIT"
repository = "https://github.com/ramarivera/fathom"

[dependencies]
# MCP SDK (official Rust SDK)
rmcp = { version = "1.1", features = [
    "server",
    "macros",
    "schemars",
    "transport-io",
    "transport-streamable-http-server",
] }

# HTTP server (for MCP SSE/HTTP transport + auth middleware)
axum = "0.8"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Middleware
tower = { version = "0.5", features = ["filter"] }

# Utilities
url = "2"

# HTTP client (for OpenAI API calls)
# Cross-reference: Windows ARM builds currently fail through reqwest -> rustls -> ring.
# Use platform-native TLS on Windows to avoid the ring native build path there.
[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.12", features = [
    "json",
    "native-tls",
], default-features = false }

[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.12", features = [
    "json",
    "rustls-tls",
], default-features = false }

[[bin]]
name = "fathom"
path = "src/main.rs"

[dev-dependencies]
wiremock = "0.6"
tokio-test = "0.4"
